name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate tag matches Cargo.toml version
        run: |
          CARGO_VERSION="v$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: wasm32-wasip1
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --target wasm32-wasip1 -- -D warnings

      - name: Test
        run: cargo test --lib

      - name: Install cargo-audit
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-audit

      - name: Security audit
        run: cargo audit

      - name: Build WASM
        run: cargo build --target wasm32-wasip1 --release

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: target/wasm32-wasip1/release/zellij-send-keys.wasm
          generate_release_notes: true
