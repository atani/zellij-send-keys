version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      routine-updates:
        applies-to: version-updates
        patterns: ["*"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      routine-updates:
        applies-to: version-updates
        patterns: ["*"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
